<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Society Directory has moved</title>
<!-- A doorway, not a page. It exists because this address was printed on
     access slips and shared with residents before the directory moved behind
     its gate; a bare 404 would strand anyone holding one.

     It carries no resident data — nothing but a link. The directory itself
     lives at the address below and still asks for an access code. -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A1628">
<link rel="canonical" href="https://society-info.hedaprateek.workers.dev/">
<meta http-equiv="refresh" content="0; url=https://society-info.hedaprateek.workers.dev/">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(150deg,#0A1628,#0F1E36 55%,#152242);
    color:#E8EEF6;line-height:1.55;
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:100%;max-width:400px;background:rgba(15,30,54,.75);
    border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:30px 26px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.8)}
  .dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    font-weight:700;font-size:20px;color:#0A1628;margin-bottom:18px;
    background:linear-gradient(135deg,#0EA5C8,#E0A81E)}
  h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  p{font-size:14px;color:#8CA0B8;margin-bottom:18px}
  .hi{color:#8CA0B8}
  a.go{display:block;text-align:center;text-decoration:none;font-size:15px;
    font-weight:600;color:#0A1628;background:#0EA5C8;border-radius:10px;
    padding:13px 16px;transition:.16s}
  a.go:hover{background:#22C3E6}
  .foot{margin-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#5C6E88;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="dot">S</div>
    <h1>The directory has moved</h1>
    <p>Same directory, same access code — a new address.<br>
      <span class="hi">वही निर्देशिका, वही कोड — नया पता।</span></p>
    <a class="go" href="https://society-info.hedaprateek.workers.dev/">Open the directory · निर्देशिका खोलें</a>
    <div class="foot">Stunity Tech — by Prateek</div>
  </div>
  <script>
    // The meta refresh above does the work; this only makes it immediate and
    // keeps the dead address out of the back-button history.
    location.replace("https://society-info.hedaprateek.workers.dev/");
  </script>
</body>
</html>
