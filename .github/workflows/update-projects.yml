name: Update project list

on:
  schedule:
    - cron: '17 3 * * *'   # once a day
  workflow_dispatch: {}     # "Run workflow" button for an on-demand refresh
  push:
    branches: [main]
    paths:
      - overrides.json
      - scripts/build-projects.mjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit projects.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --cached --quiet || git commit -m "Update project list"
          git push
